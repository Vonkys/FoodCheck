import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {getFirestore,collection,addDoc,getDocs,getDoc,doc,setDoc,updateDoc,deleteDoc,query,where} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCX9KtcPeWWHn8-zxB2GyyrN4AltkvkHjE",
  authDomain: "quickcook-498e4.firebaseapp.com",
  projectId: "quickcook-498e4",
  storageBucket: "quickcook-498e4.firebasestorage.app",
  messagingSenderId: "656166175905",
  appId: "1:656166175905:web:6eb01f50b60d7e42aa9ce0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentUserRole = null;

onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  if (!user) {
    currentUserRole = null;
    renderLogin();
    return;
  }

  try {
    const userDoc = await getDoc(doc(db, 'users', user.uid));

    if (userDoc.exists()) {
      currentUserRole = userDoc.data().role || 'user';
    } else {
      currentUserRole = 'user';
    }
  } catch (error) {
    console.error('CHYBA NAČTENÍ PROFILU:', error);
    currentUserRole = 'user';
  }

  window.renderMain();
  await inicializujJidla();
});


let lastFilterKategorie = '';
const STORAGE_KEY = 'jidlaDatabaze';
let jidla = [];
let lastScrollTop = 0;

async function inicializujJidla() {
  try {
    const snapshot = await getDocs(collection(db, 'jidla'));

    // Pokud už jsou jídla ve Firestore, načteme je
    if (!snapshot.empty) {
      jidla = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        nazev: docSnap.data().nazev,
        kategorie: docSnap.data().kategorie
      }));

      console.log('Jídla načtena z Firestore:', jidla.length);

      window.renderMain();
      return;
    }

    // Firestore je prázdný – zkusíme starou lokální databázi
    const lokalniData = localStorage.getItem(STORAGE_KEY);

    if (lokalniData) {
      try {
        const staraJidla = JSON.parse(lokalniData);

        if (Array.isArray(staraJidla) && staraJidla.length > 0) {
          jidla = staraJidla;

          console.log('Načtena stará lokální databáze jídel:', jidla.length);

          // Pouze admin ji převede do Firestore
          if (currentUserRole === 'admin') {
            await saveJidla();
            console.log('Stará databáze jídel byla převedena do Firestore.');
          }

          window.renderMain();
          return;
        }
      } catch (e) {
        console.error('CHYBA ČTENÍ LOKÁLNÍ DATABÁZE:', e);
      }
    }

    // Není nic ani lokálně
    jidla = [];

    console.log('Databáze jídel je prázdná.');

    window.renderMain();

  } catch (error) {
    console.error('CHYBA NAČÍTÁNÍ JÍDEL:', error);
    alert('❌ Jídla se nepodařilo načíst z online databáze.');
    jidla = [];
    window.renderMain();
  }
}

async function saveJidla() {
  try {
    const snapshot = await getDocs(collection(db, 'jidla'));

    for (const item of snapshot.docs) {
      await deleteDoc(item.ref);
    }

    for (const jidlo of jidla) {
      await addDoc(collection(db, 'jidla'), {
        nazev: jidlo.nazev,
        kategorie: jidlo.kategorie
      });
    }

    console.log('Jídla uložena do Firestore.');
  } catch (error) {
    console.error('CHYBA UKLÁDÁNÍ JÍDEL:', error);
    alert('❌ Jídla se nepodařilo uložit do online databáze.');
  }
}

function downloadDb() {
  const data = JSON.stringify(jidla, null, 2);
  const blob = new Blob([data], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zaloha_jidla.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 100);
}
function importDb(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const newData = JSON.parse(e.target.result);
      if (Array.isArray(newData)) {
        jidla = newData;
        saveJidla();
        msg('Databáze úspěšně načtena.');
        window.renderMain();
      } else {
        alert('Soubor nemá správný formát!');
      }
    } catch {
      alert('Chyba při načítání souboru!');
    }
  };
  reader.readAsText(file);
}

document.getElementById('btn-import-txt').onclick = () => {
  document.getElementById('txt-upload').value = "";
  document.getElementById('txt-upload').click();
};

document.getElementById('txt-upload').onchange = function(e) {
  if (e.target.files && e.target.files[0]) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(ev) {
      let lines = ev.target.result.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      if (!lines.length) { msg('Soubor je prázdný!'); return; }
      let kategorie = prompt('Zadej kategorii pro importovaná jídla:');
      if (!kategorie) { msg('Import zrušen.'); return; }
      let pridano = 0, preskoceno = 0;
      let existujiciNazvy = new Set(jidla.map(j=>j.nazev.toLowerCase()));
      for (let nazev of lines) {
        if (existujiciNazvy.has(nazev.toLowerCase())) { preskoceno++; continue; }
        jidla.push({ nazev: nazev, kategorie: kategorie });
        pridano++;
        existujiciNazvy.add(nazev.toLowerCase());
      }
      saveJidla();
      msg(`Importováno: ${pridano}, přeskočeno: ${preskoceno}`);
      window.renderMain();
    };
    reader.readAsText(file);
  }
};

function getKategorie() {
  const vse = jidla.map(j => j.kategorie);
  return Array.from(new Set(vse));
}

function msg(text) {
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerText = text;
  document.getElementById('main-content').prepend(div);
  setTimeout(()=>div.remove(), 2200);
}

window.pridatDoJidelnicku = async function(jidlo) {
  if (currentUserRole !== 'admin') {
    alert('Tuto akci může provést pouze administrátor.');
    return;
  }

  const prilohySnapshot = await getDocs(collection(db, 'prilohy'));

  const prilohy = prilohySnapshot.docs.map(docSnap => ({
    id: docSnap.id,
    ...docSnap.data()
  }));

  prilohy.sort((a, b) =>
    String(a.nazev || '').localeCompare(
      String(b.nazev || ''),
      'cs'
    )
  );
  
  const datum = await new Promise(resolve => {

    const overlay = document.createElement('div');

    overlay.style.cssText = `
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:99999;
    `;

    overlay.innerHTML = `
      <div style="
        background:white;
        padding:25px;
        border-radius:18px;
        width:320px;
        max-width:90%;
        text-align:center;
        box-shadow:0 6px 30px rgba(0,0,0,0.3);
      ">

        <h3 style="
          margin-top:0;
          color:#1960b3;
        ">
          📅 Přidat do jídelníčku
        </h3>

        <p style="margin-bottom:18px;">
          <strong>${escapeHtml(jidlo.nazev)}</strong>
        </p>

        <label style="
  display:block;
  margin-bottom:18px;
  font-weight:600;
">
  Vyber datum:

  <input
    type="date"
    id="jidelnicek-datum"
    style="
      display:block;
      width:100%;
      box-sizing:border-box;
      margin-top:8px;
      padding:10px;
      border:1px solid #a7cffa;
      border-radius:9px;
      font-size:16px;
    "
  >
</label>

<label style="
  display:block;
  margin-bottom:20px;
  font-weight:600;
">
  Vyber přílohu:

  <select
    id="jidelnicek-priloha"
    style="
      display:block;
      width:100%;
      box-sizing:border-box;
      margin-top:8px;
      padding:10px;
      border:1px solid #a7cffa;
      border-radius:9px;
      font-size:16px;
      background:white;
    "
  >
    <option value="">Bez přílohy</option>

    ${prilohy.map(p => `
      <option value="${p.id}">
        ${escapeHtml(p.nazev || 'Bez názvu')}
      </option>
    `).join('')}
  </select>
</label>
            

        <button
          id="potvrdit-datum"
          style="
            padding:11px 22px;
            border:0;
            border-radius:10px;
            background:#28a745;
            color:white;
            font-weight:bold;
            cursor:pointer;
            margin-right:6px;
          "
        >
          ✅ Přidat
        </button>

        <button
          id="zrusit-datum"
          style="
            padding:11px 22px;
            border:0;
            border-radius:10px;
            background:#d9534f;
            color:white;
            font-weight:bold;
            cursor:pointer;
          "
        >
          ❌ Zrušit
        </button>

      </div>
    `;

    document.body.appendChild(overlay);

    const input = overlay.querySelector('#jidelnicek-datum');
    const prilohaSelect = overlay.querySelector('#jidelnicek-priloha');
    
    // Dnešek jako výchozí datum
    const dnes = new Date();
    const rok = dnes.getFullYear();
    const mesic = String(dnes.getMonth() + 1).padStart(2, '0');
    const den = String(dnes.getDate()).padStart(2, '0');

    input.value = `${rok}-${mesic}-${den}`;

    overlay.querySelector('#potvrdit-datum').onclick = () => {
  const vybraneDatum = input.value;
  const vybranaPrilohaId = prilohaSelect.value;

  const vybranaPriloha = prilohy.find(
    p => p.id === vybranaPrilohaId
  );

  if (!vybraneDatum) {
    alert('Vyber datum.');
    return;
  }

  overlay.remove();

  resolve({
    datum: vybraneDatum,
    prilohaId: vybranaPriloha?.id || '',
    prilohaNazev: vybranaPriloha?.nazev || ''
  });
};

    overlay.querySelector('#zrusit-datum').onclick = () => {
      overlay.remove();
      resolve(null);
    };

    input.focus();
  });

  if (!datum) return;
  
  const vybraneDatum = datum.datum;
  const vybranaPrilohaId = datum.prilohaId;
  const vybranaPrilohaNazev = datum.prilohaNazev;
  
  try {
    await addDoc(collection(db, 'jidelnicky'), {
      datum: vybraneDatum,
      jidloId: jidlo.id || '',
      nazev: jidlo.nazev,
      kategorie: jidlo.kategorie,
      prilohaId: vybranaPrilohaId,
      prilohaNazev: vybranaPrilohaNazev,
      vytvorilUid: currentUser.uid,
      vytvorilEmail: currentUser.email,
      vytvoreno: new Date().toISOString()
    });

    msg(`✅ ${jidlo.nazev} bylo přidáno do jídelníčku na ${vybraneDatum}.`);
  } catch (error) {
    console.error('CHYBA JÍDELNÍČKU:', error);
    alert('❌ Jídlo se nepodařilo přidat do jídelníčku.');
  }
}

function getSmenaProDatum(datum) {
  // 03.08.2026 = 1. den 28denního cyklu
  const reference = new Date('2026-08-03T00:00:00');
  const cil = new Date(`${datum}T00:00:00`);

  const rozdilMs = cil - reference;
  const rozdilDni = Math.floor(rozdilMs / 86400000);

  // Cyklus 28 dní
  const denCyklu = ((rozdilDni % 28) + 28) % 28;

  const smeny = [
    'R', 'R', 'V', 'V', 'V', 'N', 'N',
    'V', 'V', 'R', 'R', 'V', 'V', 'V',
    'N', 'N', 'V', 'V', 'R', 'R', 'R',
    'V', 'V', 'N', 'N', 'V', 'V', 'V'
  ];

  const smena = smeny[denCyklu];

  if (smena === 'R') {
    return {
      text: '☀️ Ranní',
      barva: '#e67e22'
    };
  }

  if (smena === 'N') {
    return {
      text: '🌙 Noční',
      barva: '#6c5ce7'
    };
  }

  return {
    text: '💤 Volno',
    barva: '#888'
  };
}

window.smazatJidelnicek = async function(jidelnicekId) {

  if (currentUserRole !== 'admin') {
    alert('Tuto akci může provést pouze administrátor.');
    return;
  }

  const potvrdit = confirm(
    'Opravdu chceš tuto položku odstranit z jídelníčku?'
  );

  if (!potvrdit) {
    return;
  }

  try {

    const jidelnicekRef = doc(db, 'jidelnicky', jidelnicekId);

    await deleteDoc(jidelnicekRef);

    // Smažeme i případné objednávky navázané na toto jídlo
    const objednavkySnapshot =
      await getDocs(collection(db, 'objednavky'));

    for (const objednavka of objednavkySnapshot.docs) {

      const data = objednavka.data();

      if (data.jidelnicekId === jidelnicekId) {
        await deleteDoc(objednavka.ref);
      }
    }

    msg('✅ Položka byla z jídelníčku odstraněna.');

    await nactiJidelnicek();

  } catch (error) {

    console.error('CHYBA MAZÁNÍ JÍDELNÍČKU:', error);

    alert('❌ Položku se nepodařilo odstranit.');
  }
};

function renderRegisterForm() {
  document.getElementById('auth-form').innerHTML = `

          type="text"
          id="register-name"

          type="password"

          minlength="6"
          required

        >
      </label>

      <label>

        <input
          type="password"
          id="register-password2"
          minlength="6"
          required
          style="width:100%;box-sizing:border-box;padding:10px;margin:5px 0 15px;border-radius:8px;border:1px solid #a7cffa;"
        >
      </label>

      <button
        type="submit"
        style="width:100%;padding:12px;border:0;border-radius:12px;background:#28a745;color:white;font-weight:bold;cursor:pointer;"
      >
        Registrovat
      </button>

      <div id="auth-message" style="margin-top:12px;text-align:center;"></div>

    </form>
  `;

  document.getElementById('register-form').onsubmit = async (e) => {
    e.preventDefault();

    const name = document.getElementById('register-name').value.trim();
    const email = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value;
    const password2 = document.getElementById('register-password2').value;

    if (password !== password2) {
      document.getElementById('auth-message').innerText =
        '❌ Hesla se neshodují.';
      return;
    }

    try {
      const userCredential =
        await createUserWithEmailAndPassword(auth, email, password);

      await setDoc(doc(db, 'users', userCredential.user.uid), {
        name: name,
        email: email,
        role: 'user',
        createdAt: new Date().toISOString()
      });

        } catch (error) {
      console.error('REGISTRACE CHYBA:', error);
      
      let message = '❌ Registrace se nepodařila.';

      if (error.code === 'auth/email-already-in-use') {
        message = '❌ Tento e-mail už je registrovaný.';
      } else if (error.code === 'auth/weak-password') {
        message = '❌ Heslo musí mít alespoň 6 znaků.';
      } else if (error.code === 'auth/invalid-email') {
        message = '❌ Neplatný e-mail.';
      } else if (error.code === 'permission-denied') {
        message = '❌ Firebase odmítl zápis do databáze.';
      } else if (error.message) {
        message = '❌ ' + error.message;
      }

      document.getElementById('auth-message').innerText = message;
    }
  };
}

function renderJidlaTable(filter = lastFilterKategorie) {
  lastFilterKategorie = filter;
  let jidlaSorted = jidla.slice().sort((a, b) => a.nazev.localeCompare(b.nazev, 'cs', { sensitivity: 'base' }));
  let html = `
    <div class="jidla-table-wrap">
      <div class="table-filters">
        <label>Kategorie:
          <select id="filtr-kategorie">
            <option value="">-- všechny --</option>
            ${getKategorie().map(cat => `<option value="${cat}">${cat}</option>`).join('')}
          </select>
        </label>
        <button id="btn-close-table">Zavřít</button>
      </div>
      <table class="jidla-table">
        <thead>
          <tr>
            <th>Název</th>
            <th>Kategorie</th>
            <th>Akce</th>
          </tr>
        </thead>
        <tbody>
          ${jidlaSorted.map((j, realIdx) =>
            (!filter || j.kategorie === filter) ? `
            <tr>
              <td>${escapeHtml(j.nazev)}</td>
              <td><span class="category-label cat-${escapeHtml(j.kategorie)}">${escapeHtml(j.kategorie)}</span></td>
              <td class="action-btns">
  <button onclick="editJidlo(${jidla.indexOf(j)})">Upravit</button>

  <button
    onclick="pridatDoJidelnicku(${JSON.stringify(j).replace(/"/g, '&quot;')})"
    style="
      background:#28a745;
      color:white;
      border-color:#28a745;
    "
  >
    📅 Do jídelníčku
  </button>

  <button onclick="deleteJidlo(${jidla.indexOf(j)})">Smazat</button>
</td>
            </tr>
          ` : ''
          ).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('main-content').innerHTML = html;
  document.getElementById('filtr-kategorie').value = filter;
  document.getElementById('filtr-kategorie').onchange = function() {
    renderJidlaTable(this.value);
  };
  document.getElementById('btn-close-table').onclick = window.renderMain;
}

function escapeHtml(txt) {
  return (txt ?? '').replace(/[&<>"']/g, function(m) {
    return ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[m];
  });
}

            style="
              padding:11px 20px;
              border:0;
              border-radius:10px;
              background:#28a745;
              color:white;
              font-weight:bold;
              cursor:pointer;
              margin-right:6px;
            "
          >
            ➕ Přidat přílohu
          </button>

          <button
            id="btn-zpet-prilohy"
            style="
              padding:11px 20px;
              border:0;
              border-radius:10px;
              background:#6c757d;
              color:white;
              font-weight:bold;
              cursor:pointer;
            "
          >
            ← Zpět
          </button>
        </div>
    `;

    if (prilohy.length === 0) {

      html += `
        <div style="
          padding:18px;
          background:white;
          border-radius:12px;
          text-align:center;
        ">
          🥔 Zatím nemáš uloženou žádnou přílohu.
        </div>
      `;

    } else {

      html += `
        <div style="
          background:white;
          border-radius:12px;
          overflow:hidden;
        ">
      `;

      prilohy.forEach(priloha => {

        html += `
          <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            padding:12px 15px;
            border-bottom:1px solid #e2edf7;
          ">

            <strong>
              🥔 ${escapeHtml(priloha.nazev || 'Bez názvu')}
            </strong>

            <button
              onclick="smazatPrilohu('${priloha.id}')"
              style="
                padding:7px 12px;
                border:0;
                border-radius:8px;
                background:#d9534f;
                color:white;
                font-weight:bold;
                cursor:pointer;
              "
            >
              🗑️ Smazat
            </button>

          </div>
        `;

      });

      html += `</div>`;
    }

    html += `
      </div>
    `;

    document.getElementById('main-content').innerHTML = html;

    document.getElementById('btn-zpet-prilohy').onclick = () => {
      window.renderMain();
    };

    document.getElementById('btn-pridat-prilohu').onclick = () => {
      pridatPrilohu();
    };

  } catch (error) {

    console.error('CHYBA NAČÍTÁNÍ PŘÍLOH:', error);

    document.getElementById('main-content').innerHTML = `
      <div style="
        max-width:600px;
        margin:40px auto;
        padding:20px;
        background:#ffecec;
        border:1px solid #ffb5b5;
        border-radius:12px;
        text-align:center;
        color:#b00000;
      ">
        ❌ Přílohy se nepodařilo načíst.
      </div>
    `;

  }
};


window.pridatPrilohu = async function pridatPrilohu() {

  const nazev = prompt('Zadej název přílohy:');

  if (!nazev) {
    return;
  }

  const cistyNazev = nazev.trim();

  if (!cistyNazev) {
    return;
  }

  try {

    const snapshot = await getDocs(collection(db, 'prilohy'));

    const existuje = snapshot.docs.some(docSnap =>
      String(docSnap.data().nazev || '').toLowerCase() ===
      cistyNazev.toLowerCase()
    );

    if (existuje) {
      alert('Tahle příloha už existuje.');
      return;
    }

    await addDoc(collection(db, 'prilohy'), {
      nazev: cistyNazev,
      vytvorilUid: currentUser.uid,
      vytvoreno: new Date().toISOString()
    });

    msg(`✅ Příloha "${cistyNazev}" byla přidána.`);

    await renderPrilohy();

  } catch (error) {

    console.error('CHYBA PŘIDÁNÍ PŘÍLOHY:', error);

    alert('❌ Přílohu se nepodařilo přidat.');
  }
};


window.smazatPrilohu = async function smazatPrilohu(prilohaId) {

  if (currentUserRole !== 'admin') {
    alert('Tuto akci může provést pouze administrátor.');
    return;
  }

  const potvrdit = confirm(
    'Opravdu chceš tuto přílohu smazat?'
  );

  if (!potvrdit) {
    return;
  }

  try {

    await deleteDoc(
      doc(db, 'prilohy', prilohaId)
    );

    msg('✅ Příloha byla smazána.');

    await renderPrilohy();

  } catch (error) {

    console.error('CHYBA MAZÁNÍ PŘÍLOHY:', error);

    alert('❌ Přílohu se nepodařilo smazat.');
  }
};

function renderMenuGenerator() {
  const jidlaBezPolevek = jidla.filter(j => j.kategorie !== 'Polévky');
  const polevky = jidla.filter(j => j.kategorie === "Polévky");

  let html = `
    <div class="generator">
      <h2>Generátor jídelníčku</h2>
      <div class="gen-controls" style="margin-bottom:20px;">
        <button class="btn-gen-small" id="btn-gen-menu">Náhodně vybrat 10 jídel a 3 polévky</button>
      </div>
      <div id="generator-menu"></div>
    </div>
  `;
  document.getElementById('main-content').innerHTML = html;

  function shuffle(arr) {
    let a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function vygenerujMenu() {
    let nahodnaJidla = shuffle(jidlaBezPolevek).slice(0, 10);
    let nahodnePolevky = shuffle(polevky).slice(0, 3);

    let html = `
      <div class="vysledky-menu">
        <div class="menu-block">
          <div class="menu-label">Polévky (3 náhodné)</div>
          <ol>
            ${nahodnePolevky.map(p => `<li>${escapeHtml(p.nazev)}</li>`).join('')}
          </ol>
        </div>
        <div class="menu-block">
          <div class="menu-label">Hlavní jídla (10 náhodných)</div>
          <ol>
            ${nahodnaJidla.map(j =>
              `<li>${escapeHtml(j.nazev)} <span class="category-label cat-${escapeHtml(j.kategorie)}">${escapeHtml(j.kategorie)}</span></li>`
            ).join('')}
          </ol>
        </div>
      </div>
    `;
    document.getElementById('generator-menu').innerHTML = html;
  }

  document.getElementById('btn-gen-menu').onclick = vygenerujMenu;
}

document.getElementById('btn-show-database').onclick = () => renderJidlaTable(lastFilterKategorie);
document.getElementById('btn-add-new').onclick = () => renderAddJidlo();
document.getElementById('btn-generate-menu').onclick = () => renderMenuGenerator();

  }
};
